<!doctype html>
<html lang="es">
<head>
  <title>Práctica Bootstrap - Ejercitación 2 (estructura de sitio)</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    .bloque { padding: 25px; margin-bottom: 15px; color: #fff; text-align: center; border-radius: 4px; }
    .sidebar { min-height: 100%; }
  </style>
</head>
<body>

  <div class="container mt-4">

    <!-- Barra superior -->
    <div class="row">
      <div class="col-sm-12">
        <div class="bloque" style="background-color:#9b6fac">Header</div>
      </div>
    </div>

    <div class="row">

      <!-- Sidebar: tamaño 3 -->
      <div class="col-sm-3">
        <div class="bloque sidebar" style="background-color:#f2d9c9; color:#333;">
          Sidebar
        </div>
      </div>

      <!-- Contenido principal: tamaño 9 -->
      <div class="col-sm-9">

        <!-- Barra verde -->
        <div class="row">
          <div class="col-sm-12">
            <div class="bloque" style="background-color:#6cc48b">Barra verde</div>
          </div>
        </div>

        <!-- 6 rectángulos, tamaño 3 cada uno (2 filas de 3) -->
        <div class="row">
          <div class="col-sm-3"><div class="bloque" style="background-color:#a99aa3">1</div></div>
          <div class="col-sm-3"><div class="bloque" style="background-color:#a99aa3">2</div></div>
          <div class="col-sm-3"><div class="bloque" style="background-color:#a99aa3">3</div></div>
        </div>
        <div class="row">
          <div class="col-sm-3"><div class="bloque" style="background-color:#a99aa3">4</div></div>
          <div class="col-sm-3"><div class="bloque" style="background-color:#a99aa3">5</div></div>
          <div class="col-sm-3"><div class="bloque" style="background-color:#a99aa3">6</div></div>
        </div>

        <!-- 2 rectángulos celestes: chico (3) y grande (6) -->
        <div class="row">
          <div class="col-sm-3"><div class="bloque" style="background-color:#7ea6cf">Celeste chico</div></div>
          <div class="col-sm-6"><div class="bloque" style="background-color:#7ea6cf">Celeste grande</div></div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
